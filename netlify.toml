[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Order matters: Netlify checks redirects top-to-bottom, first match wins.
# 1) /api/* -> the actual function (checked first, so it never falls into the SPA catch-all)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 2) everything else that isn't a real static file -> index.html (client-side routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"
  autoLaunch = false
